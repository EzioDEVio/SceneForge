# Builds SceneForge Studio for Windows, Linux and macOS and attaches the installers
# to a DRAFT GitHub Release. Every job also runs an end-to-end test of real editor work
# in the packaged app. Publish the draft ONLY when every job is green: only published
# releases are offered to users' apps as updates.
#
#   Release:  push a tag that matches desktop/package.json, e.g.  git tag v0.3.0 && git push origin v0.3.0
#   Beta:     a version with a suffix (0.3.1-beta.1) becomes a pre-release, offered only to
#             users who enabled Help → Receive beta updates.
#   Try it:   Actions → Release → Run workflow builds the installers without publishing.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Windows, os: windows-latest, target: --win nsis --x64, experimental: false}
          - {name: Linux, os: ubuntu-22.04, target: --linux AppImage deb --x64, experimental: false}
          - {name: macOS (Apple Silicon), os: macos-14, target: --mac dmg zip --arm64, experimental: true}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'     # unsigned builds (free, open source)
      SCENEFORGE_SD_AUTOSTART: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match desktop/package.json version $version"; exit 1
          fi
          case "$version" in *-*) echo "EP_PRE_RELEASE=true" >> "$GITHUB_ENV";; esac
      - name: Install build tools
        run: |
          python -m pip install -r desktop/requirements-build.txt
          npm --prefix frontend ci
          npm --prefix desktop ci
      - name: Build and test the editor
        run: |
          npm --prefix frontend run build
          npm --prefix frontend test
          npm --prefix desktop test
      - name: Fetch and verify FFmpeg for this OS
        run: python desktop/scripts/fetch_ffmpeg.py
      - name: Bundle the Python backend
        run: python desktop/scripts/build_backend.py
      - name: Linux credential store for the smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q gnome-keyring dbus-x11 xvfb
      - name: Test the packaged backend with a real render
        run: |
          exe=desktop/build/backend/sceneforge-backend/sceneforge-backend
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          if [ "$RUNNER_OS" = "Linux" ]; then
            dbus-run-session -- bash -c "printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; python desktop/tests/smoke_backend.py --exe $exe --resources \"$PWD\" --ffmpeg-dir desktop/vendor/ffmpeg/bin"
          else
            python desktop/tests/smoke_backend.py --exe "$exe" --resources "$PWD" --ffmpeg-dir desktop/vendor/ffmpeg/bin
          fi
      - name: Build installers (and attach them to the draft release when tagged)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish=never
          case "$GITHUB_REF" in refs/tags/v*) publish=always;; esac
          cd desktop && npx electron-builder ${{ matrix.target }} --publish "$publish"
      - name: Real editor work in the packaged Linux app (end-to-end, time-limited)
        if: runner.os == 'Linux'
        run: |
          appimage=$(ls desktop/release/*.AppImage | head -1)
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          app="$RUNNER_TEMP/squashfs-root/resources"
          dbus-run-session -- bash -c "printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; python desktop/tests/e2e_backend.py --exe $app/backend/sceneforge-backend --ffmpeg-dir $app/ffmpeg/bin --resources $app/app-resources"
      - name: Real editor work in the macOS build (end-to-end, time-limited)
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d desktop/release/mac*/*.app | head -1)/Contents/Resources
          python desktop/tests/e2e_backend.py --exe "$app/backend/sceneforge-backend" --ffmpeg-dir "$app/ffmpeg/bin" --resources "$app/app-resources"
      - name: Start the installed Linux app
        if: runner.os == 'Linux'
        run: |
          export SCENEFORGE_SMOKE_REPORT="$RUNNER_TEMP/smoke.json"
          appimage=$(ls desktop/release/*.AppImage | head -1)
          dbus-run-session -- xvfb-run -a "$appimage" --appimage-extract-and-run --smoke-test --no-sandbox || true
          node -e "const r=require(process.env.SCENEFORGE_SMOKE_REPORT);if(!r.ok){console.error(r.error);process.exit(1)}console.log('started',r.version)"
      - name: Start the installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/release/*Setup.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'SceneForgeInstalled'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $env:SCENEFORGE_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $app = Start-Process -FilePath (Join-Path $installDir 'SceneForge Studio.exe') -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(90000)) { Stop-Process -Id $app.Id; throw 'Startup timed out' }
          $report = Get-Content $env:SCENEFORGE_SMOKE_REPORT | ConvertFrom-Json
          if (-not $report.ok) { throw "App failed: $($report.error)" }
          # Real editor work in the INSTALLED app's backend (import, thumbnails, effects, preview, render)
          $res = Join-Path $installDir 'resources'
          python desktop/tests/e2e_backend.py --exe (Join-Path $res 'backend/sceneforge-backend.exe') --ffmpeg-dir (Join-Path $res 'ffmpeg/bin') --resources (Join-Path $res 'app-resources')
          if ($LASTEXITCODE -ne 0) { throw 'End-to-end editor test failed in the installed app' }
      - uses: actions/upload-artifact@v4
        with:
          name: SceneForge-Studio-${{ matrix.name }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/latest*.yml
          if-no-files-found: warn
