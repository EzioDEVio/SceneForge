name: Windows Desktop Alpha
on:
  push:
    branches: ['desktop-alpha/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      SCENEFORGE_SD_AUTOSTART: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install -r desktop/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test editor
        run: |
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle private Python backend and rendering tools
        run: |
          python tests/integration/test_release_cleanup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/integration/test_credentials.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/scripts/fetch_ffmpeg.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/scripts/build_backend.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test packaged backend and real render
        run: python desktop/tests/smoke_backend.py --exe desktop/build/backend/sceneforge-backend/sceneforge-backend.exe --resources "$pwd" --ffmpeg-dir desktop/vendor/ffmpeg/bin
      - name: Build setup wizard
        run: npm --prefix desktop run dist:win
      - name: Verify installed app starts without development commands
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/release/*Setup.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'SceneForgeInstalled'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $env:SCENEFORGE_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP 'desktop-smoke.json'
          $appExe = Join-Path $installDir 'SceneForge Desktop Alpha.exe'
          $app = Start-Process -FilePath $appExe -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(90000)) { Stop-Process -Id $app.Id; throw 'Desktop startup timed out' }
          if (-not (Test-Path $env:SCENEFORGE_SMOKE_REPORT)) { throw 'No desktop startup report' }
          $report = Get-Content $env:SCENEFORGE_SMOKE_REPORT | ConvertFrom-Json
          if (-not $report.ok) { throw "Desktop failed: $($report.error)" }
          $uninstaller = Get-ChildItem $installDir/*Uninstall*.exe | Select-Object -First 1
          if (-not $uninstaller) { throw 'Uninstaller missing' }
          $uninstall = Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: SceneForge-Windows-Desktop-Alpha
          path: |
            desktop/release/*Setup.exe
            desktop/README.md
            desktop/RELEASE_NOTES.md
            desktop/THIRD_PARTY.md
          if-no-files-found: error
