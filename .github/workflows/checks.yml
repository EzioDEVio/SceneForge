name: Build and render checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 (Oct 2026)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg gnome-keyring dbus-x11
      - run: python -m pip install -r backend/requirements.txt httpx
      - run: npm --prefix frontend ci
      - run: python scripts/check_release_versions.py
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test
      - name: Release file verification regressions (offline)
        run: python -m unittest discover -s desktop/tests -p 'test_release*.py' -v
      - name: Isolated editor draft renderer regressions
        run: |
          python tests/integration/test_editor_drafts.py
          python tests/integration/test_recovered_motion.py
          python tests/integration/test_route_owner_fixes.py
          python tests/integration/test_autocut_continuous.py
      - name: Install editor browser test tooling
        run: |
          npm --prefix tests/browser ci
          npm --prefix tests/browser exec -- playwright install --with-deps chromium
      - name: Timeline upload, title-card, shortcut and overlay browser regressions
        run: npm --prefix tests/browser test
      - name: Credential migration and combined render checks with native vault
        run: |
          dbus-run-session -- bash -e -c '
            printf "%s" "ci-disposable-keyring" | gnome-keyring-daemon --unlock --components=secrets
            python tests/integration/test_credentials.py
            python tests/integration/test_combined.py
            python tests/integration/test_editor_plus.py
            python tests/integration/test_hosted_adapters.py
            python tests/integration/test_timeline.py
            python tests/integration/test_text_thumbs.py
            python tests/integration/test_looks.py
            python tests/integration/test_audio_edit.py
            python tests/integration/test_old_film.py
            python tests/integration/test_finishing.py
            python tests/integration/test_overlays.py
            python tests/integration/test_effects_pack.py
            python tests/integration/test_batch_b.py
            python tests/integration/test_text_motion.py
            python tests/integration/test_v06.py
            python tests/integration/test_caption_segments.py
            python tests/integration/test_caption_long_path.py
            python tests/integration/test_effect_presets_addon.py
            python tests/integration/test_effects_rc6.py
            python tests/integration/test_effect_params.py
            python tests/integration/test_fx_stack_presets.py
            python tests/integration/test_share_location.py
            python tests/integration/test_video_generation.py
            python tests/integration/test_local_transcribe.py
            python tests/integration/test_stale_jobs.py
            python tests/integration/test_rc6_timeline_audio.py
            python tests/integration/test_cutout.py
            python tests/integration/test_video_cutout.py
            python tests/integration/test_voice_isolation.py
            python tests/integration/test_textured_title.py
            python tests/integration/test_library_rc9.py
            python tests/integration/test_rc8_audio.py
            python tests/integration/test_rc9_timeline.py
            python tests/integration/test_071_usability.py
            python tests/integration/test_reframe_gpu.py
            python tests/integration/test_cleanup.py
            python tests/integration/test_090_features.py
            python tests/integration/test_091_fixes.py
            python tests/integration/test_keyframes_playback.py
            python tests/integration/test_timeline_layers.py
            python tests/integration/test_video_layers.py
            python tests/integration/test_censor_caption_fx.py
            python tests/integration/test_story_tools.py
            python tests/integration/test_free_timeline.py
            python tests/integration/test_owner_font_preview.py
            python tests/integration/test_managed_ai.py
          '
