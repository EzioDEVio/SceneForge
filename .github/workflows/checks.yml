name: Build and render checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg gnome-keyring dbus-x11
      - run: python -m pip install -r backend/requirements.txt numpy httpx
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test
      - name: Credential migration and combined render checks with native vault
        run: |
          dbus-run-session -- bash -e -c '
            printf "%s" "ci-disposable-keyring" | gnome-keyring-daemon --unlock --components=secrets
            python tests/integration/test_credentials.py
            python tests/integration/test_combined.py
          '
      - run: python tests/integration/test_editor_plus.py
      - run: python tests/integration/test_hosted_adapters.py
      - run: python tests/integration/test_timeline.py
