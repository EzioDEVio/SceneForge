services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "127.0.0.1:8880:8880"
    restart: unless-stopped
  chatterbox:
    profiles: ["arabic"]
    build: ./chatterbox
    environment:
      CHATTERBOX_DEVICE: cpu
    ports:
      - "127.0.0.1:8881:8881"
    volumes:
      - chatterbox-models:/root/.cache/huggingface
    restart: unless-stopped
  stable_diffusion:
    profiles: ["images"]
    build: ./stable-diffusion
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - stable-diffusion-models:/models
    restart: unless-stopped
volumes:
  stable-diffusion-models:
  chatterbox-models:
